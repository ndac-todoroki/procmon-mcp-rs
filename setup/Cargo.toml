[package]
name = "procmon-mcp-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Graphical installer and uninstaller for procmon-mcp"
license = "MIT"
publish = false

[dependencies]
procmon-mcp = { path = ".." }
# 0.101 adds font_family, needed to show paths in a monospace font. Not on crates.io yet.
windows-reactor = { version = "0.101.0", git = "https://github.com/microsoft/windows-rs", rev = "5bd440b234e5d966e48f210e05ab217cefe00e10" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
