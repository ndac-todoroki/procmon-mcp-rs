[package]
name = "procmon-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server that captures with Sysinternals Process Monitor and summarizes PML logs"
license = "MIT"
publish = false

[dependencies]
nyquest = { version = "0.5.0", features = ["blocking"] }
nyquest-backend-winhttp = { version = "0.2.0", features = ["blocking"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Authorization"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
