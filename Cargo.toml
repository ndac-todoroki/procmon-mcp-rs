[package]
name = "procmon-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server that captures with Sysinternals Process Monitor and summarizes PML logs"
license = "MIT"
publish = false

[dependencies]
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
